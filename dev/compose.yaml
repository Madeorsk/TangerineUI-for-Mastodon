services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./mastodon
      dockerfile: ../Dockerfile
    user: root
    working_dir: /workspace/dev/mastodon
    command: ['bash', '-lc', 'bin/dev']
    environment:
      RAILS_ENV: development
      NODE_ENV: development
      BIND: 0.0.0.0
      VITE_RUBY_HOST: 0.0.0.0
      VITE_DEV_SERVER_PUBLIC: ${VITE_DEV_SERVER_PUBLIC:-localhost:3036}
      BOOTSNAP_CACHE_DIR: /tmp
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: '5432'
      ES_ENABLED: 'false'
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost:3000}
      BUNDLE_PATH: vendor/bundle
    volumes:
      - ..:/workspace:cached
      # Theme sources mounted at the checkout's real paths (not symlinks), so Sass resolves `@use 'application'`
      # against Mastodon's styles dir, while edits in this repo still hot-reload through Vite.
      - ../mastodon/app/javascript/styles/tangerineui.scss:/workspace/dev/mastodon/app/javascript/styles/tangerineui.scss
      - ../mastodon/app/javascript/styles/tangerineui-purple.scss:/workspace/dev/mastodon/app/javascript/styles/tangerineui-purple.scss
      - ../mastodon/app/javascript/styles/tangerineui-cherry.scss:/workspace/dev/mastodon/app/javascript/styles/tangerineui-cherry.scss
      - ../mastodon/app/javascript/styles/tangerineui-lagoon.scss:/workspace/dev/mastodon/app/javascript/styles/tangerineui-lagoon.scss
      - ../mastodon/app/javascript/styles/tangerineui:/workspace/dev/mastodon/app/javascript/styles/tangerineui
      - ../mastodon/app/javascript/styles/tangerineui-purple:/workspace/dev/mastodon/app/javascript/styles/tangerineui-purple
      - ../mastodon/app/javascript/styles/tangerineui-cherry:/workspace/dev/mastodon/app/javascript/styles/tangerineui-cherry
      - ../mastodon/app/javascript/styles/tangerineui-lagoon:/workspace/dev/mastodon/app/javascript/styles/tangerineui-lagoon
      - ../mastodon/config/locales/tangerineui.yml:/workspace/dev/mastodon/config/locales/tangerineui.yml
    ports:
      - '3000:3000'
      - '3036:3036'
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
